# P3-15 · PR 守门 CI：pull_request 触发测试与构建（push main 由 pages.yml 覆盖）
name: ci
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 覆盖率即门禁：跑测试同时校验 vite.config.ts 里的 thresholds，低于下限直接红
      - run: npm run test:coverage
      - run: npm run build
